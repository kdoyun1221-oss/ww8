<!doctype html>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f4f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11151c" media="(prefers-color-scheme: dark)">

<title>Wordly Wise 8 예문 퀴즈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: one study column. Home = grouped menu (외우기 / 문제 / 복습) + options; study screens pin their action buttons to a bottom dock */
:root{
  --bg:#f2f4f8; --card:#ffffff; --sunk:#f6f8fb; --ink:#18202d; --muted:#626e80; --line:#dfe4ec;
  --accent:#2a4fd6; --accent-soft:#e6ecfd; --ok:#1d7a4b; --ok-soft:#e3f4ea; --bad:#b4322f; --bad-soft:#fce8e7;
  --f-en:"Newsreader", Georgia, "Times New Roman", serif;
  --f-ui:"Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11151c; --card:#1a2029; --sunk:#151a22; --ink:#e8ecf2; --muted:#9aa5b6; --line:#2a323e;
  --accent:#93acff; --accent-soft:#222c46; --ok:#72d6a3; --ok-soft:#163126; --bad:#ff8d87; --bad-soft:#381c1c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151c; --card:#1a2029; --sunk:#151a22; --ink:#e8ecf2; --muted:#9aa5b6; --line:#2a323e;
  --accent:#93acff; --accent-soft:#222c46; --ok:#72d6a3; --ok-soft:#163126; --bad:#ff8d87; --bad-soft:#381c1c; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.65;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 0}
button{font:inherit;color:inherit}
.wrap{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-bottom:28px}
header h1{font-family:var(--f-en);font-weight:600;font-size:1.5rem;margin:0;line-height:1.2;text-wrap:balance}
header p{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:18px}
.label{font-size:.78rem;letter-spacing:.04em;color:var(--muted);font-weight:700;margin-bottom:8px}
.note{font-size:.88rem;color:var(--muted);margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* home menu */
.group{display:flex;flex-direction:column;gap:8px}
.tiles2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{text-align:left;display:flex;flex-direction:column;gap:2px;border:1.5px solid var(--line);background:var(--sunk);border-radius:12px;padding:13px 14px;cursor:pointer;min-width:0}
.tile b{font-size:1.02rem;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tile span{font-size:.82rem;color:var(--muted);line-height:1.45}
.tile[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.tile[aria-pressed="true"] b{color:var(--accent)}
.cnt{font-family:var(--f-mono);font-size:.76rem;font-weight:500;color:var(--bad);background:var(--bad-soft);border-radius:999px;padding:0 8px;line-height:1.6}
.cnt.zero{color:var(--muted);background:var(--line)}
.grid-l{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.chip{font-size:.95rem;border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:9px 6px;cursor:pointer;font-variant-numeric:tabular-nums;text-align:center}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--card);font-weight:700}
.btn{font-size:1.02rem;font-weight:700;border:0;background:var(--accent);color:var(--card);border-radius:12px;padding:14px 16px;cursor:pointer;width:100%;min-height:52px}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.bad{background:var(--bad-soft);color:var(--bad)}
.btn.ok{background:var(--ok);color:var(--card)}
.btn.small{min-height:44px;padding:10px;font-size:.95rem}
.btns{display:flex;flex-direction:column;gap:8px}
.wlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.wlist li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);min-width:0}
.wlist .w{font-family:var(--f-en);font-weight:600;font-size:1.08rem;flex:none}
.wlist .m{flex:1;min-width:0;color:var(--muted);font-size:.86rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x{font-size:.8rem;border:1px solid var(--line);background:var(--sunk);color:var(--muted);border-radius:8px;padding:4px 10px;cursor:pointer;flex:none}
.tag{font-family:var(--f-mono);font-size:.72rem;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:6px;flex:none;white-space:nowrap}
.tag.t{color:var(--muted);background:var(--line)}

/* study screens */
.stage{display:flex;flex-direction:column;gap:12px}
.top{display:flex;align-items:center;gap:10px}
.back{font-size:.9rem;border:0;background:transparent;color:var(--muted);padding:6px 2px;cursor:pointer}
.meta{flex:1;display:flex;justify-content:flex-end;gap:10px;font-family:var(--f-mono);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.bar{height:5px;background:var(--line);border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
.dock{position:sticky;bottom:0;z-index:5;background:var(--bg);padding:10px 0 calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* flashcard */
.fc{position:relative;background:var(--card);border:1px solid var(--line);border-radius:20px;min-height:340px;padding:22px 20px;display:flex;flex-direction:column;gap:16px;cursor:pointer;text-align:left;width:100%;box-shadow:0 1px 2px rgba(20,30,50,.05),0 8px 24px rgba(20,30,50,.06)}
.fc.anim{animation:flip .22s ease-out}
@keyframes flip{from{transform:rotateX(14deg) scale(.98);opacity:.55}to{transform:none;opacity:1}}
.rvbadge{position:absolute;top:14px;left:14px;font-size:.75rem;font-weight:700;color:var(--bad);background:var(--bad-soft);border-radius:999px;padding:3px 10px}
.front{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.big{font-family:var(--f-en);font-size:clamp(2.4rem,11vw,3.2rem);font-weight:600;line-height:1.05;overflow-wrap:anywhere}
.sub{font-size:.85rem;color:var(--muted)}
.tap{font-size:.82rem;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:4px 12px;flex:none}
.fhead{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.fhead .w{font-family:var(--f-en);font-size:1.75rem;font-weight:600;line-height:1.1}
.fc .rvbadge+.fhead{padding-top:22px}
.senses{display:flex;flex-direction:column;gap:18px}
.sense{display:grid;grid-template-columns:26px 1fr;gap:4px 10px}
.sense .n{grid-row:span 3;width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:.85rem;display:grid;place-items:center;margin-top:1px}
.sense .m{font-weight:700;font-size:1.08rem;min-width:0}
.ex{font-family:var(--f-en);font-size:1.12rem;line-height:1.55;background:var(--sunk);border-radius:10px;padding:10px 12px;min-width:0}
.ex b{color:var(--accent);font-weight:600}
.ko{color:var(--muted);font-size:.92rem;line-height:1.6;min-width:0}

/* quiz */
.qcard{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px 18px;display:flex;flex-direction:column;gap:18px}
.qtype{font-size:.82rem;font-weight:700;color:var(--muted)}
.sent{font-family:var(--f-en);font-size:1.32rem;line-height:1.6;margin:0}
.sent b{color:var(--accent);font-weight:600}
.blank{display:inline-block;min-width:4.5em;border-bottom:2.5px solid var(--accent);height:1.1em;vertical-align:-2px}
.hint{font-family:var(--f-ui);font-size:.74rem;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:3px;white-space:nowrap}
.qword{font-family:var(--f-en);font-size:clamp(2.2rem,10vw,2.8rem);font-weight:600;text-align:center;line-height:1.1;margin:4px 0}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;border:1.5px solid var(--line);background:var(--sunk);border-radius:12px;padding:12px 14px;cursor:pointer;min-height:52px;min-width:0}
.opt .ol{flex:none;width:26px;height:26px;border-radius:7px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.opt .ot{min-width:0;overflow-wrap:anywhere}
.opt.en .ot{font-family:var(--f-en);font-size:1.18rem}
.opt.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:700}
.opt.ok .ol{background:var(--ok);border-color:var(--ok);color:var(--card)}
.opt.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.opt.bad .ol{background:var(--bad);border-color:var(--bad);color:var(--card)}
.opt.dim{opacity:.5}
.opts.use .opt{align-items:flex-start;padding:12px 14px}
.opts.use .opt .ol{margin-top:2px}
.opts.use .ot{font-family:var(--f-en);font-size:1.04rem;line-height:1.5}
.uw{font-weight:600;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px;text-decoration-color:var(--accent)}
.strike{text-decoration:line-through;text-decoration-color:var(--bad);color:var(--bad)}
.tile.wide{grid-column:1/-1}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opt:disabled{cursor:default}
.fb{border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);background:var(--card)}
.verdict{font-weight:700;font-size:1.05rem;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.fb.ok .verdict{color:var(--ok)}.fb.bad .verdict{color:var(--bad)}
.saved{font-size:.78rem;font-weight:500;color:var(--muted);background:var(--sunk);border-radius:999px;padding:2px 10px}
.fword{font-family:var(--f-en);font-size:1.25rem;font-weight:600}

/* results */
.score{font-family:var(--f-en);font-size:2.8rem;margin:0;line-height:1;font-variant-numeric:tabular-nums}
.rlist{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:12px}
.rlist li{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.rlist .w{font-family:var(--f-en);font-weight:600;font-size:1.12rem}
@media (min-width:560px){.opts.en-grid{display:grid;grid-template-columns:1fr 1fr}.opts.en-grid .opt:last-child{grid-column:span 2}}
@media (max-width:360px){.tiles2{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}.fc.anim{animation:none}}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <h1>Wordly Wise 8 · Lesson 11–20</h1>
    <p>교재 예문으로 외우고, 풀고, 틀린 것만 다시 보기</p>
  </header>

  <!-- HOME -->
  <section class="panel" id="home">
    <div class="group">
      <div class="label" style="margin:0">외우기</div>
      <button class="tile" data-mode="card"><b>단어 카드</b><span>카드를 눌러 뜻·예문·해석 보기</span></button>
    </div>
    <div class="group">
      <div class="label" style="margin:0">문제 · 5지선다</div>
      <div class="tiles2">
        <button class="tile" data-mode="blank"><b>빈칸 채우기</b><span>교재 예문 빈칸에 맞는 단어</span></button>
        <button class="tile" data-mode="mean"><b>뜻 맞추기</b><span>단어 보고 한국어 뜻 고르기</span></button>
        <button class="tile wide" data-mode="use"><b>어색한 쓰임 고르기</b><span>5개 문장 중 밑줄 단어가 어울리지 않는 문장 찾기</span></button>
      </div>
    </div>
    <div class="group">
      <div class="label" style="margin:0">복습</div>
      <div class="tiles2">
        <button class="tile" data-mode="rv"><b>다시 볼 카드 <i class="cnt" id="rvCnt">0</i></b><span>‘다시 볼래요’ 누른 카드</span></button>
        <button class="tile" data-mode="wr"><b>오답 노트 <i class="cnt" id="wrCnt">0</i></b><span>문제에서 틀린 것</span></button>
      </div>
    </div>

    <div id="optLesson">
      <div class="label">Lesson</div>
      <div class="grid-l" id="lessons"></div>
    </div>
    <div id="optCount">
      <div class="label">문항 수</div>
      <div class="grid-4" id="counts">
        <button class="chip" data-n="10">10</button>
        <button class="chip" data-n="20">20</button>
        <button class="chip" data-n="40">40</button>
        <button class="chip" data-n="0">전부</button>
      </div>
    </div>
    <div id="rvPane"></div>
    <div id="wrPane"></div>
    <button class="btn" id="startBtn">시작</button>
  </section>

  <!-- CARDS -->
  <section class="stage" id="cards" hidden>
    <div class="top"><button class="back" data-home>← 처음으로</button><div class="meta"><span id="cTag"></span><span id="cNum"></span></div></div>
    <div class="bar"><i id="cProg"></i></div>
    <button class="fc" id="fc" type="button"></button>
    <div class="dock">
      <div class="two">
        <button class="btn bad" id="cAgain">다시 볼래요</button>
        <button class="btn ok" id="cKnow">외웠어요</button>
      </div>
      <button class="btn ghost small" id="cPrev">이전 카드</button>
    </div>
  </section>

  <!-- QUIZ -->
  <section class="stage" id="quiz" hidden>
    <div class="top"><button class="back" data-home>← 처음으로</button><div class="meta"><span id="qTag"></span><span id="qNum"></span></div></div>
    <div class="bar"><i id="qProg"></i></div>
    <div class="qcard"><div id="qBody"></div><div id="qOpts"></div></div>
    <div id="qFb"></div>
    <div class="dock" id="qDock" hidden><button class="btn" id="nextBtn">다음</button></div>
  </section>

  <!-- RESULT -->
  <section class="panel" id="result" hidden></section>
</div>

<script>
const RAW=`11|augment|늘리다, 증가시키다|In order to buy a new bike before summer, Iris _ her savings by babysitting the twins next door.|augmented|여름 전에 새 자전거를 사려고 아이리스는 옆집 쌍둥이를 돌봐서 저축액을 늘렸다.
11|benign|친절한, 상냥한|Friendly nurses were a _ presence in the hospital.|benign|친절한 간호사들은 병원 안에서 상냥한 존재였다.
11|benign|(날씨 등) 온화한, 해롭지 않은|Although the weather had been _ in the morning when Juan and Ana started out on their bikes, by noon the sky was dark, and they heard thunder in the distance.|benign|후안과 아나가 출발한 아침엔 날씨가 온화했지만, 정오 무렵 하늘이 어두워지고 멀리서 천둥소리가 들렸다.
11|connoisseur|감정가, 전문가|A _ of rare stamps would recognize the famous English “penny black” at once.|connoisseur|희귀 우표 감정가라면 유명한 영국의 ‘페니 블랙’을 즉시 알아볼 것이다.
11|discern|(눈으로) 알아보다|About forty-five minutes after the ferry left Block Island, the passengers could _ the coast of Rhode Island before them.|discern|페리가 블록 아일랜드를 떠난 지 약 45분 후, 승객들은 앞에 있는 로드아일랜드 해안을 알아볼 수 있었다.
11|discern|이해하다, 인식하다|Not until she finished the novel did Janice _ the significance of the title.|discern|재니스는 소설을 다 읽고 나서야 제목의 의미를 이해했다.
11|discern|분별하다, 구별하다|Unfortunately for Laura, her teacher was able to _ Laura’s handwriting from her mother’s handwriting.|discern|불행히도 로라의 선생님은 로라의 필체와 어머니의 필체를 구별할 수 있었다.

11|embellish|장식하다, 꾸미다|The entire surface of the black cloth had been _ with colored threads stitched in elaborate patterns.|embellished|검은 천 표면 전체가 정교한 무늬로 수놓은 색실로 장식되어 있었다.

11|execute|(예술 작품을) 만들어 내다|The sculptor Maya Lin often uses unusual materials, such as pieces of wood or shards of glass, to _ her pieces.|execute|조각가 마야 린은 나무 조각이나 유리 파편 같은 독특한 재료로 작품을 제작하곤 한다.

11|hallowed|신성한, 존경받는|Arlington National Cemetery is _ ground because it is the burial place for soldiers who have died in war.|hallowed|알링턴 국립묘지는 전사한 군인들이 묻힌 곳이라 신성한 땅이다.

  WORDS.forEach(g=>{g.mean=[...new Set(g.senses.map(s=>s.m))].join(" / ")})}

const KEY="ww8-study-v2";
const S={rv:new Set(),wb:new Set(),wm:new Set(),wu:new Set()};   // wu: 쓰임 오답(item id of the altered sentence)   // rv: 다시 볼 카드(word key) · wb: 빈칸 오답(item id) · wm: 뜻 오답(word key)
try{
  const d=JSON.parse(localStorage.getItem(KEY)||"null");
  if(d){S.rv=new Set((d.rv||[]).filter(k=>WORD_BY.has(k)));S.wb=new Set((d.wb||[]).filter(k=>ITEM_BY.has(k)));S.wm=new Set((d.wm||[]).filter(k=>WORD_BY.has(k)));S.wu=new Set((d.wu||[]).filter(k=>ITEM_BY.has(k)))}

}catch(_){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify({rv:[...S.rv],wb:[...S.wb],wm:[...S.wm],wu:[...S.wu]}))}catch(_){} counts()}
const wrongTotal=()=>S.wb.size+S.wm.size+S.wu.size;
function counts(){

const C={deck:[],i:0,flipped:false,again:[],hist:[],name:""};
function startCards(list,shuf,name){
  Object.assign(C,{deck:shuf?shuffle(list):list.slice(),i:0,flipped:false,again:[],hist:[],name});
  show("cards"); renderCard();
}
function renderCard(){
  const g=C.deck[C.i];
  $("cTag").textContent=`${C.name} · L${g.L}`;
  $("cNum").textContent=`${C.i+1} / ${C.deck.length}`;
  $("cProg").style.width=(C.i/C.deck.length*100)+"%";
  $("cPrev").disabled=C.i===0;
  const badge=S.rv.has(g.key)?`<span class="rvbadge">다시 볼 카드</span>`:"";
  $("fc").innerHTML=badge+(!C.flipped
    ?`<div class="front"><div class="big">${esc(g.w)}</div><div class="sub">뜻 ${g.senses.length}개</div><div class="tap">눌러서 뜻과 예문 보기</div></div>`
    :`<div class="fhead"><span class="w">${esc(g.w)}</span><span class="tap">앞면</span></div><div class="senses">${g.senses.map((s,i)=>`<div class="sense"><div class="n">${i+1}</div><div class="m">${esc(s.m)}</div><div class="ex">${filled(s)}</div><div class="ko">${esc(s.k)}</div></div>`).join("")}</div>`);
}
function flip(){C.flipped=!C.flipped;renderCard();const fc=$("fc");fc.classList.remove("anim");void fc.offsetWidth;fc.classList.add("anim")}
$("fc").addEventListener("click",flip);
function cardNext(knew){
  const g=C.deck[C.i];

  persist();
  C.i++; C.flipped=false; window.scrollTo(0,0);
  if(C.i>=C.deck.length) return cardsDone();
  renderCard();
}
function cardPrev(){
  if(!C.i) return;
  const h=C.hist.pop(); if(h){h.had?S.rv.add(h.g.key):S.rv.delete(h.g.key); if(!h.knew)C.again.pop(); persist()}
  C.i--; C.flipped=false; renderCard();
}
$("cKnow").addEventListener("click",()=>cardNext(true));
$("cAgain").addEventListener("click",()=>cardNext(false));
$("cPrev").addEventListener("click",cardPrev);
function cardsDone(){
  show("result");
  const n=C.again.length, tot=C.deck.length, again=C.again.slice(), deck=C.deck.slice();
  $("result").innerHTML=`<div class="label">${esc(C.name)} 한 바퀴 끝</div>
    <p class="score">${tot-n} / ${tot}</p>
    <p class="note">외웠어요 ${tot-n}개 · 다시 볼래요 ${n}개</p>
    <div class="btns">
      ${n?`<button class="btn" id="rA">이번에 ‘다시 볼래요’ 누른 ${n}개 바로 보기</button>`:""}
      ${S.rv.size?`<button class="btn ghost" id="rR">모아 둔 다시 볼 카드 ${S.rv.size}개 보기</button>`:`<p class="note">모아 둔 다시 볼 카드가 없어요.</p>`}
      <button class="btn ghost" id="rS">이번 카드 섞어서 다시 보기</button>
      <button class="btn ghost" id="rH">처음으로</button>
    </div>
    ${n?`<div><div class="label">다시 볼 단어</div><ul class="wlist">${again.map(g=>`<li><span class="w">${esc(g.w)}</span><span class="tag">L${g.L}</span><span class="m">${esc(g.mean)}</span></li>`).join("")}</ul></div>`:""}`;
  if(n)$("rA").onclick=()=>startCards(again,true,"다시 볼 카드");
  if(S.rv.size)$("rR").onclick=()=>startCards(WORDS.filter(g=>S.rv.has(g.key)),true,"다시 볼 카드");
  $("rS").onclick=()=>startCards(deck,true,C.name);
  $("rH").onclick=goHome;
}

/* ---------- quiz ---------- */
const Q={list:[],i:0,score:0,wrong:[],done:false,correct:"",name:""};
function startQuiz(list,name){
  Object.assign(Q,{list:shuffle(list),i:0,score:0,wrong:[],done:false,name});
  show("quiz"); renderQ();
}
function distractors(word,lesson,k,field,correct){
  let src=WORDS.filter(g=>g.L===lesson&&g.w!==word);
  const out=[],seen=new Set([correct]);
  const take=arr=>{for(const g of shuffle(arr)){const v=g[field];if(g.w===word||seen.has(v))continue;seen.add(v);out.push(v);if(out.length===k)return}};
  take(src); if(out.length<k) take(WORDS);
  return out;
}
/* 어색한 쓰임: 4 textbook sentences as written + the target sentence with another word from its lesson swapped in */
const ADJ=new Set("benign discerning grotesque hallowed malevolent ornate pastoral precarious renowned affluent arbitrary irksome ostentatious prestigious prolific reticent ardent contagious innovative synonymous congenial enigmatic ineffectual infallible irrepressible luminous stagnant sublime voluminous humane irrational lurid restive glib haggard immaculate incessant indulgent pungent strident vehement impeccable combustible inclement indelible paramount requisite squeamish feasible impregnable indefatigable phenomenal picturesque simultaneous susceptible fervent gullible inflammatory overt servile".split(" "));
const pos=x=>x.m.trim().endsWith("다")?"v":(ADJ.has(x.w)&&!(x.w==="requisite"&&x.a!=="requisite"))?"a":"n";
const fam=w=>w.toLowerCase().slice(0,4);
const formClass=a=>{a=a.toLowerCase();if(/^[A-Z]/.test(a))a=a.toLowerCase();return a.endsWith("ing")?"ing":a.endsWith("ed")?"ed":a.endsWith("s")?"s":"base"};
const cap=(s,like)=>/^[A-Z]/.test(like)?s[0].toUpperCase()+s.slice(1):s.toLowerCase();
function buildUse(odd){
  const used=new Set([fam(odd.w)]);
  const near=ITEMS.filter(x=>x.L===odd.L), far=ITEMS.filter(x=>x.L!==odd.L);
  // replacement: different word family from the same lesson, same grammatical form when possible
  const before=odd.s.split("_")[0];
  const art=/\ban\s*$/i.test(before)?"vowel":/\ba\s*$/i.test(before)?"cons":"";
  const artOk=x=>!art||(art==="vowel")===/^[aeiou]/i.test(x.a);
  const shape=x=>pos(x)+(pos(x)==="a"?"":formClass(x.a));
  const want=shape(odd);
  const ok=x=>!used.has(fam(x.w))&&artOk(x);
  const rep=shuffle(near).find(x=>ok(x)&&shape(x)===want)
         ||shuffle(far).find(x=>ok(x)&&shape(x)===want)
         ||shuffle(near).find(x=>ok(x)&&pos(x)===pos(odd))
         ||shuffle(ITEMS).find(x=>ok(x)&&pos(x)===pos(odd))
         ||shuffle(near).find(ok);
  used.add(fam(rep.w));
  const others=[];
  for(const x of [...shuffle(near),...shuffle(far)]){ if(used.has(fam(x.w))) continue; used.add(fam(x.w)); others.push(x); if(others.length===4) break; }
  const repWord=cap(rep.a,odd.a);
  const rows=shuffle([{it:odd,word:repWord,odd:true},...others.map(it=>({it,word:it.a,odd:false}))]);
  return {rows,rep,repWord};
}
const uline=(it,word)=>esc(it.s).replace("_",`<span class="uw">${esc(word)}</span>`);
function renderQ(){
  const q=Q.list[Q.i], it=q.it; Q.done=false;
  $("qTag").textContent=`${Q.name} · L${it.L}`;
  $("qNum").textContent=`${Q.i+1} / ${Q.list.length} · 맞음 ${Q.score}`;
  $("qProg").style.width=(Q.i/Q.list.length*100)+"%";
  $("qFb").innerHTML=""; $("qDock").hidden=true;
  let opts,en;
  if(q.type==="blank"){
    const h=hintFor(it);
    $("qBody").innerHTML=`<div class="qtype">빈칸에 알맞은 단어는?</div><p class="sent">${esc(it.s).replace("_",`<span class="blank"></span>${h?`<span class="hint">${h}</span>`:""}`)}</p>`;
    Q.correct=it.w; opts=shuffle([it.w,...distractors(it.w,it.L,4,"w",it.w)]); en=true;
  }else if(q.type==="use"){
    q.u=buildUse(it);
    $("qBody").innerHTML=`<div class="qtype">밑줄 친 단어의 쓰임이 <u>어색한</u> 문장은?</div>`;
    Q.correct="odd";
    $("qOpts").innerHTML=`<div class="opts use">${q.u.rows.map((r,i)=>`<button class="opt" data-o="${r.odd?"odd":"ok"+i}"><span class="ol">${i+1}</span><span class="ot">${uline(r.it,r.word)}</span></button>`).join("")}</div>`;
    return;
  }else{
    $("qBody").innerHTML=`<div class="qtype" style="text-align:center">이 단어의 뜻은?</div><div class="qword">${esc(it.w)}</div>`;
    Q.correct=it.mean; opts=shuffle([it.mean,...distractors(it.w,it.L,4,"mean",it.mean)]); en=false;
  }
  $("qOpts").innerHTML=`<div class="opts${en?" en-grid":""}">${opts.map((o,i)=>`<button class="opt${en?" en":""}" data-o="${esc(o)}"><span class="ol">${i+1}</span><span class="ot">${esc(o)}</span></button>`).join("")}</div>`;
}
$("qOpts").addEventListener("click",e=>{const b=e.target.closest(".opt");if(b)answer(b)});
function answer(b){
  if(Q.done) return; Q.done=true;
  const q=Q.list[Q.i], it=q.it, ok=b.dataset.o===Q.correct;
  $("qOpts").querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(x.dataset.o===Q.correct)x.classList.add("ok");else if(x!==b)x.classList.add("dim")});
  if(!ok) b.classList.add("bad");
  const set=q.type==="blank"?S.wb:q.type==="use"?S.wu:S.wm, key=q.type==="mean"?it.key:it.id, had=set.has(key);
  let tag="";
  if(ok){Q.score++; if(had){set.delete(key);tag="오답 노트에서 뺐어요"}}
  else {Q.wrong.push(q); set.add(key); tag=had?"오답 노트에 있어요":"오답 노트에 저장"}
  persist();
  $("qNum").textContent=`${Q.i+1} / ${Q.list.length} · 맞음 ${Q.score}`;
  let body;
  if(q.type==="use"){
    const {rep,repWord}=q.u;
    body=`<div>어색한 문장: <span class="strike">${esc(repWord)}</span> → <span class="fword">${esc(it.a)}</span></div>
      <div class="ex">${filled(it)}</div><div class="ko">${esc(it.k)}</div>
      <div><span class="fword">${esc(it.w)}</span> · ${esc(it.m)}</div>
      <div class="ko">잘못 들어간 <b>${esc(rep.w)}</b>: ${esc(wordOf(rep).mean)}</div>`;
  }else if(q.type==="blank"){
    $("qBody").querySelector(".sent").innerHTML=filled(it);
    body=`<div><span class="fword">${esc(it.w)}</span> · ${esc(it.m)}</div><div class="ko">${esc(it.k)}</div>`;
  }else{
    body=`<div><span class="fword">${esc(it.w)}</span> · ${esc(it.mean)}</div>`+it.senses.map(s=>`<div class="ex">${filled(s)}</div><div class="ko">${esc(s.k)}</div>`).join("");
  }
  $("qFb").innerHTML=`<div class="fb ${ok?"ok":"bad"}"><div class="verdict"><span>${ok?"정답":"오답"}</span>${tag?`<span class="saved">${tag}</span>`:""}</div>${body}</div>`;
  $("nextBtn").textContent=Q.i===Q.list.length-1?"결과 보기":"다음";
  $("qDock").hidden=false;
  $("nextBtn").focus({preventScroll:true});
  $("qFb").scrollIntoView({behavior:reduce()?"auto":"smooth",block:"nearest"});
}
function nextQ(){Q.i++; if(Q.i>=Q.list.length) return quizDone(); renderQ(); window.scrollTo(0,0)}
$("nextBtn").addEventListener("click",nextQ);
function quizDone(){
  show("result");
  const tot=Q.list.length, wrong=Q.wrong.slice(), pct=Math.round(Q.score/tot*100);
  const wordKeys=new Set(wrong.map(q=>q.type==="mean"?q.it.key:wordOf(q.it).key));
  $("result").innerHTML=`<div class="label">${esc(Q.name)} 결과</div>
    <p class="score">${Q.score} / ${tot}</p>
    <p class="note">정답률 ${pct}%${wrong.length?` · 틀린 ${wrong.length}문제는 오답 노트에 저장됐어요`:""}</p>
    <div class="btns">
      ${wrong.length?`<button class="btn" id="qW">틀린 ${wrong.length}문제 바로 다시 풀기</button>
      <button class="btn ghost" id="qC">틀린 단어 ${wordKeys.size}개 카드로 보기</button>`:""}
      ${wrongTotal()?`<button class="btn ghost" id="qN">오답 노트 열기 (${wrongTotal()}개)</button>`:""}
      <button class="btn ghost" id="qH">처음으로</button>
    </div>
    ${wrong.length?`<div><div class="label">틀린 문제</div><ul class="rlist">${wrong.map(q=>{const it=q.it;
      if(q.type==="use") return `<li><div><span class="tag t">쓰임</span> <span class="strike">${esc(q.u.repWord)}</span> → <span class="w">${esc(it.a)}</span> · ${esc(it.m)}</div><div class="ex">${filled(it)}</div><div class="ko">${esc(it.k)}</div></li>`;
      return q.type==="blank"
        ?`<li><div><span class="tag t">빈칸</span> <span class="w">${esc(it.w)}</span> · ${esc(it.m)}</div><div class="ex">${filled(it)}</div><div class="ko">${esc(it.k)}</div></li>`
        :`<li><div><span class="tag t">뜻</span> <span class="w">${esc(it.w)}</span> · ${esc(it.mean)}</div>${it.senses.map(s=>`<div class="ex">${filled(s)}</div>`).join("")}</li>`}).join("")}</ul></div>`:""}`;
  if(wrong.length){$("qW").onclick=()=>startQuiz(wrong,"틀린 문제");$("qC").onclick=()=>startCards(WORDS.filter(g=>wordKeys.has(g.key)),true,"오답 단어")}
  if(wrongTotal())$("qN").onclick=()=>{H.mode="wr";goHome()};
  $("qH").onclick=goHome;
}

/* ---------- keyboard ---------- */
document.addEventListener("keydown",e=>{
  if(e.target.closest&&e.target.closest("input,textarea"))return;
  if(!$("cards").hidden){
    if(e.key===" "){e.preventDefault();flip()}
    else if(e.key==="ArrowRight")cardNext(true);
    else if(e.key==="ArrowDown")cardNext(false);
    else if(e.key==="ArrowLeft")cardPrev();
    return;
  }
  if(!$("quiz").hidden){
    if(Q.done&&e.key==="Enter"&&document.activeElement!==$("nextBtn")){e.preventDefault();nextQ();return}
    if(!Q.done&&/^[1-5]$/.test(e.key)){const b=$("qOpts").querySelectorAll(".opt")[+e.key-1];if(b)answer(b)}
  }
});
renderHome();
</script>

if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})})}
